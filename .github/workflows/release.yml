name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: sing-box-tui.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: sing-box-tui
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
            binary: sing-box-tui
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            binary: sing-box-tui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Resolve release version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="manual-${GITHUB_SHA::7}"
          fi
          echo "RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Run tests
        run: cargo test --locked

      - name: Test Unix installer
        if: matrix.archive == 'tar.gz'
        run: sh scripts/tests/install.sh

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Windows release
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $staging = "dist/sing-box-tui-${env:RELEASE_VERSION}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$staging/"
          Copy-Item README.md "$staging/"
          if (Test-Path LICENSE) { Copy-Item LICENSE "$staging/" }
          if (Test-Path LICENSE.md) { Copy-Item LICENSE.md "$staging/" }
          Compress-Archive -Path $staging -DestinationPath "$staging.zip" -Force
          Remove-Item -Recurse -Force $staging

      - name: Package Unix release
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: ./scripts/package-release.sh "${{ matrix.target }}" "${RELEASE_VERSION}" "${{ matrix.binary }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/sing-box-tui-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "sing-box-tui-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc.zip"
            "sing-box-tui-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz"
            "sing-box-tui-${GITHUB_REF_NAME}-aarch64-apple-darwin.tar.gz"
            "sing-box-tui-${GITHUB_REF_NAME}-x86_64-apple-darwin.tar.gz"
          )
          for asset in "${expected[@]}"; do
            test -s "dist/${asset}"
          done
          actual_count=$(find dist -maxdepth 1 -type f | wc -l | tr -d '[:space:]')
          test "${actual_count}" -eq "${#expected[@]}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
