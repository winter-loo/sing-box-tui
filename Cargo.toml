[package]
name = "sing-box-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
crossterm = "0.29.0"
ratatui = "0.30.0"
reqwest = { version = "0.13.2", features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["process", "rt-multi-thread", "time"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
serde_yaml = "0.9.34"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.2"
urlencoding = "2.1.3"
rusqlite = { version = "0.39.0", features = ["bundled"] }
